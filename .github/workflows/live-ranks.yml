name: 라이브 순위 갱신

# 교안 사이트 '많이 팔린 10개' 의 라이브 탭을 만든다.
# 브랜드 자체 라이브(셀러) + 크리에이터 라이브 합산 순위다.
#
# 이 저장소는 공개라 Actions 로그를 누구나 읽는다.
# 그래서 스크립트도, 커밋되는 JSON 도 금액을 담지 않는다 — 순위와 pid 만.
on:
  schedule:
    # 매일 01:17 UTC. 0시에 도는 '많이 팔린 10개' 갱신 뒤에 돌려,
    # 거기서 정리된 한국어 이름·제품컷을 그대로 가져다 쓴다.
    - cron: '17 1 * * *'
  workflow_dispatch:
    inputs:
      days:
        description: '며칠을 셀지'
        required: false
        default: '30'
      top_n:
        description: '순위에 실을 제품 수'
        required: false
        default: '10'

# 결과(web/data/live-ranks.json)를 리포지토리에 커밋해야 하므로 쓰기 권한이 필요하다.
permissions:
  contents: write

# 수동 실행과 스케줄이 겹쳐 같은 파일을 동시에 커밋하지 않도록 직렬화한다.
concurrency:
  group: live-ranks
  cancel-in-progress: false

jobs:
  # 작업 id 는 영문·숫자만 쓸 수 있다. 보이는 이름만 한국어로 둔다.
  ranks:
    name: 라이브 순위
    runs-on: ubuntu-latest
    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 의존성 설치
        working-directory: live-gmv
        run: pip install -r requirements.txt

      # 403 이 날 때 어느 주소를 시트에 공유해야 하는지 알아야 한다.
      # 서비스 계정 주소는 비밀값이 아니다(열쇠는 JSON 안의 private_key 다).
      - name: 서비스 계정 주소 확인
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: |
          python -c "import json,os;d=json.loads(os.environ['GOOGLE_CREDENTIALS']);print('이 주소를 원본 시트에 뷰어로 공유해야 한다:', d.get('client_email'))"

      - name: 라이브 순위 뽑기
        working-directory: live-gmv
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          SRC_SHEET_ID: '1RjXg3xO1UMhG_Ykmprn4v4bx2gVntOkjW-SE3RZOzhU'
          SRC_TAB: '(중요,수동) 제품별 유입매출 RAW (520업데이트)'
          DAYS: ${{ inputs.days || '30' }}
          TOP_N: ${{ inputs.top_n || '10' }}
        run: python live_ranks.py

      - name: 결과 커밋 (푸시되면 Vercel 이 사이트를 다시 배포한다)
        run: |
          if git diff --quiet -- web/data/live-ranks.json; then
            echo "순위가 그대로여서 커밋하지 않습니다."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/data/live-ranks.json
          git commit -m "chore: 라이브 순위 갱신 ($(date -u '+%Y-%m-%d'))"
          # 사람이 같은 시각에 푸시했을 수 있으니 리베이스 후 재시도한다.
          for attempt in 1 2 3 4; do
            if git push; then
              echo "푸시 완료"
              exit 0
            fi
            echo "푸시 실패, 재시도 ${attempt}회차"
            sleep $((2 ** attempt))
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
          done
          echo "::error::순위 파일 푸시에 실패했습니다."
          exit 1
