<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>오늘 — PM 트래커</title>
<style>
  /* 디자인: d'Alba 가격표 화면(products)과 같은 말투 — 노란 머리판 · 검정 잉크 · 알약 단추 */
  :root{
    --page:#f9f9f7; --surface:#fcfcfb; --card:#ffffff;
    --ink:#141414; --ink-soft:#52514e; --ink-faint:#898781;
    --line:#e3e1d8; --border:rgba(11,11,11,.1); --hover:rgba(11,11,11,.04);
    --yellow:#ffe01b; --yellow-wash:#fff7c2; --yellow-soft:rgba(255,224,27,.26);
    --red:#e02b20; --green:#0ca30c;
    /* 예전 이름 — 스크립트 안 인라인 스타일이 쓴다 */
    --paper:var(--page); --paper-deep:#efeee8; --berry:var(--ink); --sage:var(--green); --gold:#b8860b;
    --gold-soft:var(--yellow-soft); --berry-soft:rgba(20,20,20,.06); --sage-soft:rgba(12,163,12,.1);
    --radius:10px;
    --font:system-ui,-apple-system,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  }
  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{margin:0;background:var(--page);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;}
  button,input,select{font:inherit;color:inherit;}
  .wrap{max-width:940px;margin:0 auto;padding:0 16px 96px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;}

  /* ---------- 상단 줄 ---------- */
  .topnav{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:20px 0 16px;border-bottom:1px solid var(--border);margin-bottom:22px;}
  .brand-home{font-size:15px;font-weight:700;letter-spacing:-.01em;white-space:nowrap;}
  .nav-right{display:flex;align-items:center;gap:8px;}
  .seg{display:inline-flex;border:1px solid var(--ink);border-radius:999px;overflow:hidden;background:var(--card);}
  .seg button{appearance:none;border:0;background:transparent;cursor:pointer;padding:5px 14px;font-size:13px;line-height:1.4;color:var(--ink-soft);white-space:nowrap;}
  .seg button+button{border-left:1px solid var(--ink);}
  .seg button.active{background:var(--ink);color:#fff;font-weight:700;}
  .seg button:hover:not(.active){color:var(--ink);background:var(--hover);}
  .icon-btn{width:30px;height:30px;border-radius:999px;border:1px solid var(--border);background:var(--card);cursor:pointer;font-size:14px;color:var(--ink-soft);display:grid;place-items:center;}
  .icon-btn:hover{border-color:var(--ink);color:var(--ink);}
  .text-btn{background:none;border:none;color:var(--ink-faint);font-size:13px;cursor:pointer;padding:4px 2px;white-space:nowrap;}
  .text-btn:hover{color:var(--ink);text-decoration:underline;}
  .save-btn{background:var(--ink);color:#fff;border:1px solid var(--ink);border-radius:999px;padding:8px 16px;font-size:13px;font-weight:700;cursor:pointer;}
  .save-btn:hover{opacity:.88;}

  /* ---------- 노란 머리판 ---------- */
  .ps-head{background:var(--yellow);color:var(--ink);border-radius:var(--radius);padding:24px 22px 20px;margin:0 0 18px;}
  .ps-kicker{margin:0;font-size:11.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;}
  .ps-h1{margin:8px 0 0;font-size:clamp(32px,7vw,52px);font-weight:800;letter-spacing:-.035em;line-height:1.05;word-break:keep-all;}
  .ps-sub{margin:10px 0 0;font-size:14px;line-height:1.5;display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;}
  .clockout{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;}
  .clockout input{border:1px solid var(--ink);background:rgba(255,255,255,.55);border-radius:999px;padding:2px 8px;font-size:12.5px;font-weight:700;}
  .ps-stats{display:flex;flex-wrap:wrap;gap:10px 30px;margin:18px 0 0;padding:16px 0 0;border-top:2px solid var(--ink);}
  .ps-stats div{display:flex;flex-direction:column-reverse;}
  .ps-stats dt{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;}
  .ps-stats dd{margin:0;font-size:28px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.15;}
  .ps-asof{margin:14px 0 0;font-size:11.5px;font-weight:600;letter-spacing:.04em;opacity:.72;}
  .ps-asof .save-status{font-weight:700;color:var(--ink) !important;}

  /* ---------- 달력 ---------- */
  .cal{padding:16px 16px 10px;margin-bottom:18px;border:1px solid var(--ink);}
  .cal-head{display:flex;align-items:center;gap:6px;margin-bottom:8px;}
  .cal-title{font-size:16px;font-weight:800;flex:1;letter-spacing:-.01em;}
  .cal-nav{width:30px;height:30px;border-radius:999px;border:1px solid var(--border);background:var(--card);cursor:pointer;font-size:15px;color:var(--ink-soft);}
  .cal-nav:hover{border-color:var(--ink);color:var(--ink);}
  .cal-today{border:1px solid var(--ink);background:var(--card);border-radius:999px;padding:0 12px;height:30px;font-size:12.5px;font-weight:700;cursor:pointer;white-space:nowrap;}
  .cal-today:hover{background:var(--yellow-soft);}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;}
  .cal-dow{font-size:10.5px;font-weight:700;letter-spacing:.08em;color:var(--ink-faint);text-align:center;padding:4px 0 6px;}
  .cal-dow.sun,.cal-day.sun .d-num{color:var(--red);}
  .cal-day{border:none;background:none;border-radius:10px;height:46px;cursor:pointer;display:flex;flex-direction:column;align-items:center;padding-top:5px;gap:3px;}
  .cal-day:hover{background:var(--hover);}
  .cal-day.out{opacity:.3;}
  .cal-day .d-num{font-size:13.5px;font-weight:600;width:27px;height:27px;line-height:27px;border-radius:999px;text-align:center;font-variant-numeric:tabular-nums;}
  .cal-day.today .d-num{background:var(--yellow);font-weight:800;color:var(--ink) !important;}
  .cal-day.sel .d-num{background:var(--ink);color:#fff !important;font-weight:800;}
  .cal-day .d-dots{display:flex;gap:3px;height:6px;}
  .cal-day .d-dots i{width:6px;height:6px;border-radius:50%;display:block;}
  .d-dots .open{background:var(--ink);}
  .d-dots .carry{background:var(--yellow);box-shadow:inset 0 0 0 1px var(--ink);}
  .d-dots .done{background:var(--green);}
  .cal-legend{display:flex;gap:14px;justify-content:flex-end;font-size:11.5px;color:var(--ink-soft);margin-top:6px;}
  .cal-legend i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:middle;}

  /* ---------- 로그인 / 가입 ---------- */
  #authScreen{display:none;max-width:400px;margin:10vh auto 0;padding:0 16px;}
  #authScreen .auth-head{background:var(--yellow);border-radius:var(--radius) var(--radius) 0 0;padding:22px 22px 18px;border:1px solid var(--ink);border-bottom:2px solid var(--ink);}
  #authScreen .brand{font-size:11.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;}
  #authScreen h1{font-size:34px;font-weight:800;margin:6px 0 0;letter-spacing:-.035em;}
  #authScreen .card{padding:20px 22px 22px;border:1px solid var(--ink);border-top:none;border-radius:0 0 var(--radius) var(--radius);}
  #authScreen label{display:block;font-size:12.5px;font-weight:700;margin:12px 0 6px;}
  #authScreen input{width:100%;border:1px solid var(--border);border-radius:var(--radius);padding:11px 13px;font-size:15px;background:var(--surface);}
  #authScreen input:focus-visible{outline:2px solid var(--ink);outline-offset:1px;}
  #authScreen .save-btn{width:100%;margin-top:18px;padding:12px;font-size:15px;}
  #authScreen .switch{margin-top:14px;font-size:13px;color:var(--ink-soft);text-align:center;}
  #authScreen .switch a{color:var(--ink);font-weight:700;cursor:pointer;text-decoration:underline;}
  #authMsg{color:var(--red);font-size:13px;font-weight:600;min-height:16px;margin-top:12px;}
  .signup-only{display:none;}
  #authScreen.signup .signup-only{display:block;}

  /* ---------- 이번 주 집중 (노란 띠) ---------- */
  .focus-strip{display:flex;flex-direction:column;gap:6px;margin-bottom:16px;}
  .focus-strip:empty{display:none;}
  .focus-row{display:flex;align-items:center;gap:10px;padding:10px 14px;border:1px solid var(--ink);border-left-width:6px;border-radius:8px;background:var(--yellow-wash);}
  .focus-row .fn{font-size:12px;font-weight:800;flex-shrink:0;font-variant-numeric:tabular-nums;}
  .focus-row .ft{font-size:14px;font-weight:700;flex:1;min-width:0;background:none;border:none;padding:2px 4px;border-radius:6px;}
  .focus-row .fx{font-size:13px;font-weight:700;flex-shrink:0;background:none;border:none;text-align:right;width:96px;padding:2px 4px;border-radius:6px;}
  .focus-row input:focus{outline:1px solid var(--ink);background:#fff;}

  /* ---------- 할 일 입력 ---------- */
  .add-card{padding:14px;margin-bottom:12px;}
  .quickadd{display:flex;gap:8px;}
  .quickadd input[type=text]{flex:1;min-width:0;padding:11px 14px;border:1px solid var(--border);border-radius:var(--radius);font-size:15px;background:var(--surface);}
  .quickadd input[type=text]:focus-visible{outline:2px solid var(--ink);outline-offset:1px;}
  .quickadd button{background:var(--ink);color:#fff;border:none;border-radius:var(--radius);padding:0 20px;font-size:14px;font-weight:700;cursor:pointer;}
  .opt-row{display:flex;align-items:center;gap:8px;margin-top:12px;flex-wrap:wrap;}
  .opt-lbl{font-size:10.5px;font-weight:700;letter-spacing:.1em;color:var(--ink-faint);width:58px;flex-shrink:0;}
  .opt-row .seg button{padding:4px 12px;font-size:12.5px;}
  .opt-row input[type=date]{font-size:12.5px;padding:4px 10px;border:1px solid var(--border);border-radius:999px;background:var(--card);color:var(--ink-soft);}
  .opt-gap{width:10px;}

  /* 카테고리 칩 — 직접 추가·삭제 */
  .ps-chips{display:flex;flex-wrap:wrap;gap:6px;flex:1;min-width:0;}
  .ps-chips button{appearance:none;cursor:pointer;font-size:12.5px;font-weight:600;padding:5px 11px;border-radius:999px;border:1px solid var(--border);background:var(--surface);color:var(--ink-soft);display:inline-flex;align-items:center;gap:6px;white-space:nowrap;}
  .ps-chips button:hover{border-color:var(--ink-faint);color:var(--ink);}
  .ps-chips button.on{background:var(--ink);border-color:var(--ink);color:#fff;}
  .ps-chips button.add{border-style:dashed;color:var(--ink);}
  .ps-chips button.edit{border:none;background:none;color:var(--ink-faint);text-decoration:underline;padding:5px 4px;}
  .ps-chips .x{font-size:11px;opacity:.7;}
  .ps-chips.editing button.cat-chip{border-color:var(--red);color:var(--red);background:#fff;}
  .ps-chips input{font-size:12.5px;padding:4px 11px;border:1px solid var(--ink);border-radius:999px;width:130px;background:#fff;}
  .ps-chips input:focus-visible{outline:2px solid var(--yellow);}

  /* ---------- 날짜 묶음 머리 ---------- */
  .group-label{display:flex;align-items:baseline;gap:8px;margin:22px 0 10px;padding-bottom:8px;border-bottom:1px solid var(--border);font-size:15px;font-weight:700;letter-spacing:-.01em;}
  .group-label em{font-style:normal;font-size:12px;font-weight:400;color:var(--ink-faint);font-variant-numeric:tabular-nums;}

  /* ---------- 할 일 ---------- */
  .task-row{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 14px;margin-bottom:8px;transition:border-color .12s;}
  .task-row:hover{border-color:var(--ink);}
  .task-row.done{opacity:.55;}
  .task-row{border-left:5px solid var(--cat,var(--line));}
  .task-row:hover{border-left-color:var(--cat,var(--ink));}
  /* 이월 게이지: 카드 아래쪽 막대. 하루 지날 때마다 20%씩 찬다(5일째 꽉 참). 글자 뒤는 흰색 그대로 */
  /* 이월은 노란색(빨강은 급건 전용) */
  .task-row.carried{padding-bottom:17px;
    background:
      linear-gradient(var(--yellow),var(--yellow)) left bottom / var(--carry-pct,20%) 6px no-repeat,
      linear-gradient(rgba(255,224,27,.28),rgba(255,224,27,.28)) left bottom / 100% 6px no-repeat,
      #fff;}
  .badge.dplus{background:var(--yellow);border-color:var(--ink);color:var(--ink);font-weight:800;font-variant-numeric:tabular-nums;}
  .badge.urgent{background:var(--red);border-color:var(--red);color:#fff;font-weight:800;cursor:pointer;}
  .badge.normal{cursor:pointer;}
  .badge.urgent:hover,.badge.normal:hover{outline:2px solid var(--yellow-soft);}
  /* 진행중 표시 (체크박스는 그대로, 제목 옆 단추로 켜고 끈다) */
  .t-prog{background:none;border:1px dashed var(--border);border-radius:999px;padding:1px 9px;font-size:11.5px;color:var(--ink-faint);cursor:pointer;white-space:nowrap;}
  .t-prog:hover{border-color:var(--ink);color:var(--ink);}
  .t-prog.on{background:var(--yellow);border:1px solid var(--ink);color:var(--ink);font-weight:800;}
  .t-prog.on::before{content:'';display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ink);margin-right:5px;vertical-align:1px;animation:prog-blink 1.6s ease-in-out infinite;}
  @keyframes prog-blink{50%{opacity:.25;}}
  @media (prefers-reduced-motion:reduce){.t-prog.on::before{animation:none;}}
  .task-row.inprog{box-shadow:inset 0 0 0 1.5px var(--ink);}
  /* 진행중 칸: 맨 위 노란 판 */
  .prog-block{background:var(--yellow-wash);border:1.5px solid var(--ink);border-radius:14px;padding:4px 12px 6px;margin:6px 0 14px;}
  .prog-block .group-label.prog-group{margin:8px 0 10px;border-bottom-color:rgba(20,20,20,.18);font-size:15px;align-items:center;}
  .prog-dot{width:9px;height:9px;border-radius:50%;background:var(--ink);display:inline-block;animation:prog-blink 1.6s ease-in-out infinite;}
  @media (prefers-reduced-motion:reduce){.prog-dot{animation:none;}}
  .prog-hint{font-size:12px;font-weight:400;color:var(--ink-faint);margin-left:auto;}
  .prog-block.empty-prog{background:var(--surface);border-style:dashed;border-color:var(--ink-faint);}
  .prog-block.empty-prog .prog-dot{background:var(--ink-faint);animation:none;}
  .prog-tasks{min-height:28px;}
  #prioSeg button.active[data-prio="urgent"]{background:var(--red);}
  #prioSeg{border-color:var(--ink);}

  /* 드래그로 순서 바꾸기 */
  .cat-block{margin-bottom:2px;}
  .cat-block .group-label.cat-group{cursor:grab;user-select:none;}
  .cat-block .group-label .grip,.task-row .grip{color:var(--ink-faint);font-size:13px;letter-spacing:-2px;cursor:grab;user-select:none;touch-action:none;}
  .task-row .grip{padding:2px 2px 0 0;margin-left:-4px;flex-shrink:0;line-height:1.4;}
  .task-row .grip:hover,.cat-block .group-label:hover .grip{color:var(--ink);}
  .cat-tasks{min-height:6px;}
  .drag-ghost{opacity:.35;}
  .drag-chosen{box-shadow:0 6px 18px rgba(0,0,0,.12);}

  /* 완료 기록 탭 */
  .hist-day{margin-bottom:6px;}
  .hist-row{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--cat,var(--line));border-radius:10px;padding:9px 12px;margin-bottom:6px;}
  .hist-row .h-title{flex:1;min-width:0;font-size:14.5px;font-weight:600;word-break:break-word;}
  .hist-row .h-meta{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end;}
  .hist-row input[type=checkbox]{width:18px;height:18px;accent-color:var(--ink);flex-shrink:0;cursor:pointer;}
  .hist-more{display:block;margin:14px auto 0;border:1px solid var(--ink);background:var(--card);border-radius:999px;padding:6px 16px;font-size:13px;font-weight:700;cursor:pointer;}
  .task-row.moved{opacity:.6;background:var(--surface);}
  .task-main{display:flex;align-items:flex-start;gap:12px;}
  .task-row input[type=checkbox]{appearance:none;-webkit-appearance:none;width:22px;height:22px;border:1.5px solid var(--ink);border-radius:6px;margin:0;flex-shrink:0;cursor:pointer;display:grid;place-items:center;background:#fff;}
  .task-row input[type=checkbox]:hover{background:var(--yellow-soft);}
  .task-row input[type=checkbox]:checked{background:var(--ink);}
  .task-row input[type=checkbox]:checked::after{content:'';width:6px;height:11px;border:solid var(--yellow);border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px);}
  .t-title-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .t-title{font-size:15px;font-weight:600;line-height:1.45;word-break:break-word;}
  .task-row.done .t-title{text-decoration:line-through;}
  .t-expand{background:none;border:1px solid var(--border);border-radius:999px;padding:1px 8px;font-size:11.5px;color:var(--ink-faint);cursor:pointer;}
  .t-expand:hover{border-color:var(--ink);color:var(--ink);}
  .t-meta{display:flex;gap:5px;margin-top:7px;flex-wrap:wrap;}
  .badge{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;line-height:1.35;border:1px solid var(--border);color:var(--ink-soft);background:var(--card);white-space:nowrap;}
  .badge.cat{background:var(--surface);}
  .badge.cat[style]{font-weight:700;}
  .cat-dot{display:inline-block;width:8px;height:8px;border-radius:50%;flex-shrink:0;}
  .group-label.cat-group{font-size:14px;margin-top:20px;align-items:center;}
  .group-label.cat-group:first-child{margin-top:4px;}
  .badge.owner-me{border-color:var(--ink);color:var(--ink);}
  .badge.owner-vn,.badge.owner-agency{border-color:var(--ink-faint);}
  .badge.due{}
  .badge.overdue{background:var(--red);border-color:var(--red);color:#fff;}
  .badge.postpone{background:var(--yellow-soft);border-color:var(--ink);color:var(--ink);font-weight:700;}
  .badge.moved{border-style:dashed;}
  .t-body{flex:1;min-width:0;}
  .t-x{background:none;border:none;color:var(--ink-faint);font-size:14px;cursor:pointer;padding:2px 5px;flex-shrink:0;border-radius:6px;}
  .t-x:hover{color:var(--red);background:var(--hover);}
  .empty{color:var(--ink-soft);font-size:14px;padding:30px 0;text-align:center;border:1px dashed var(--line);border-radius:12px;}

  .sub-panel{display:none;margin:10px 0 0 34px;border-top:1px dashed var(--line);padding-top:8px;}
  .sub-panel.open{display:block;}
  .sub-row{display:flex;align-items:center;gap:8px;padding:5px 0;}
  .sub-row input[type=checkbox]{width:17px;height:17px;border-radius:4px;}
  .sub-row input[type=checkbox]:checked::after{width:4px;height:8px;border-width:0 2px 2px 0;}
  .sub-row .st-title{font-size:13.5px;}
  .t-title,.st-title{cursor:text;border-radius:5px;padding:0 3px;margin:0 -3px;}
  .t-title:hover,.st-title:hover{background:var(--yellow-soft);}
  .title-edit{font:inherit;font-size:15px;font-weight:600;width:100%;min-width:0;padding:3px 8px;border:1.5px solid var(--ink);border-radius:8px;background:#fff;}
  .sub-row .title-edit{font-size:13.5px;font-weight:400;padding:2px 7px;}
  .title-edit:focus-visible{outline:3px solid var(--yellow-soft);}
  .sub-row.done .st-title{text-decoration:line-through;color:var(--ink-faint);}
  .sub-row .sub-x{margin-left:auto;background:none;border:none;color:var(--ink-faint);font-size:12px;cursor:pointer;}
  .sub-add{display:flex;gap:6px;margin-top:6px;}
  .sub-add input{flex:1;min-width:0;font-size:13px;padding:6px 10px;border:1px solid var(--border);border-radius:8px;background:var(--surface);}
  .sub-add button{font-size:12px;border:1px solid var(--ink);background:#fff;border-radius:999px;padding:4px 12px;cursor:pointer;}

  .routine-mini{display:flex;gap:8px;margin:0 0 4px;flex-wrap:wrap;}
  .routine-mini:empty{display:none;}
  .routine-chip{flex:1;min-width:150px;display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:13.5px;font-weight:600;cursor:pointer;}
  .routine-chip input{width:16px;height:16px;accent-color:var(--ink);}
  .routine-chip.checked{opacity:.5;}
  .routine-chip.checked span{text-decoration:line-through;}

  footer{margin-top:40px;padding-top:16px;border-top:1px solid var(--border);font-size:12px;color:var(--ink-faint);line-height:1.6;}

  @media (max-width:640px){
    .stat-grid{grid-template-columns:repeat(2,1fr);}
    .topnav{padding:14px 0 12px;margin-bottom:14px;}
    .brand-home{font-size:14px;}
    .nav-right{gap:4px;}

<!-- 드래그로 순서 바꾸기 (휴대폰 터치도 지원) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js"></script>
<script>
/* ============= 기본값 — 저장된 데이터가 없을 때만 사용 ============= */
// 새 계정이 처음 보는 빈 템플릿 (특정 사람의 업무 내용이 들어가지 않게 비워 둔다)
const DEFAULT_DATA = {
  focus: [],
  categories: ["캐스팅","계약","리포트","광고운영","VN팀","콤퍼트","출장","가설전략","기타"],
  tasks: [],
  routine: [],
  weeks: [
    {label:"1주", published:"", sold:""},{label:"2주", published:"", sold:""},
    {label:"3주", published:"", sold:""},{label:"4주", published:"", sold:""},
  ],
  allocations: [],
  budgetPlan: { total: 0 },
  growth: { lastMonth: 0, thisMonth: 0 },
  daily: {
    booking:{ current:0, target:0, synced:false },
    budget:{ used:0, total:0, synced:false },
    videos:{ today:0, cumulative:0, synced:false },
    revenue:{ today:0, cumulative:0, synced:false },
    inventory:[],
    inventorySynced:false
  },
  creators: [],
};
/* ---------- 날짜 도우미 (모두 이 기기 현지 날짜 기준 'YYYY-MM-DD') ---------- */
function ymd(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function todayStr(){ return ymd(new Date()); }
function parseYmd(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function daysBetween(a,b){ return Math.round((parseYmd(b)-parseYmd(a))/86400000); }
const DOW = ["일","월","화","수","목","금","토"];
function esc(s){ return String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

let selectedDate = todayStr();
let calMonth = new Date(new Date().getFullYear(), new Date().getMonth(), 1);

/* ============= 저장/불러오기 (클라우드 + 이 기기 캐시) =============
 * - 정본은 서버(/api/data, Upstash Redis).
 * - 저장은 값이 바뀔 때마다 자동. 잦은 입력을 묶어서 0.8초 뒤 한 번에 올린다(디바운스).
 * - 이 기기 localStorage 에도 즉시 캐시해서, 오프라인이거나 서버가 잠깐 죽어도 화면이 유지된다.
 */
let STORAGE_KEY = 'pmTrackerData';   // 로그인 후 'pmTrackerData:<아이디>' 로 바뀐다(기기 캐시도 사람별로)
let DATA = DEFAULT_DATA;
let booting = true;       // 초기 로드 중에는 서버로 되쓰지 않는다(기본값 덮어쓰기 방지)
let saveTimer = null;

function setSaveStatus(text, color){
  const el = document.getElementById('saveStatus');
  if(!el) return;
  el.textContent = text;
  el.style.color = color || 'var(--sage)';
}

async function loadData(){
  // 1) 서버(정본)
  try{
    const res = await fetch('/api/data', { cache:'no-store' });
    if(res.status===401) return { data:null, source:'auth' };
    if(res.ok){
      const json = await res.json();
      if(json && json.data && Array.isArray(json.data.tasks)) return { data: json.data, source:'server' };
      if(json && json.data === null) return { data: null, source:'server-empty' };
    }
  }catch(e){ console.warn('서버에서 불러오기 실패, 로컬 캐시를 확인합니다', e); }
  // 2) 이 기기 캐시
  try{
    const cached = localStorage.getItem(STORAGE_KEY);
    if(cached){ const p = JSON.parse(cached); if(p && Array.isArray(p.tasks)) return { data:p, source:'cache' }; }
  }catch(e){}
  // 3) 기본값
  return { data: structuredClone(DEFAULT_DATA), source:'default' };
}

function persist(){
  // 이 기기에는 즉시 저장
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(DATA)); }catch(e){}
  if(booting) return;               // 초기 렌더 중에는 서버로 올리지 않는다
  setSaveStatus('저장 중…', 'var(--ink-soft)');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveToServer, 800);
}

async function saveToServer(){
  try{
    const res = await fetch('/api/data', {
      method:'PUT',
      headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify(DATA)
    });
    if(res.status===401){ showAuth(); return false; }
    if(!res.ok) throw new Error('HTTP '+res.status);
    setSaveStatus('저장됨 · 클라우드', 'var(--sage)');
    return true;
  }catch(e){
    console.warn('클라우드 저장 실패', e);
    setSaveStatus('오프라인 — 이 기기에만 저장됨', 'var(--gold)');
    return false;
  }
}

async function reloadFromServer(){
  setSaveStatus('불러오는 중…', 'var(--ink-soft)');
  const { data, source } = await loadData();
  if(source==='server' && data){
    DATA = data;
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(DATA)); }catch(e){}
    renderAll();
    setSaveStatus('최신 내용 불러옴', 'var(--sage)');
  }else if(source==='auth'){
    showAuth();
  }else if(source==='server-empty'){
    setSaveStatus('서버에 저장된 내용이 아직 없어요', 'var(--gold)');
  }else{
    setSaveStatus('서버에 연결하지 못했어요', 'var(--berry)');
  }
}

let nextId = Math.max(...DATA.tasks.map(t=>t.id), 0) + 1;
function fmtDate(str){ const d=new Date(str+"T00:00:00"); return (d.getMonth()+1)+"/"+d.getDate(); }
function isOverdue(str){ return str < todayStr(); }
function nowLabel(){ const d=new Date(); return String(d.getHours()).padStart(2,'0')+":"+String(d.getMinutes()).padStart(2,'0'); }

function renderHeader(){
  const t = new Date();
  document.getElementById('todayDate').textContent = (t.getMonth()+1)+"월 "+t.getDate()+"일 "+DOW[t.getDay()]+"요일";
}

/* ---------- 할 일의 날짜 규칙 ----------
 * task.date   : 그 일을 하기로 한 날 (달력에서 고른 날에 추가하면 그날)
 * task.doneAt : 체크한 날
 * task.due    : (선택) 마감일
 * 체크 안 된 일은 날짜가 지나면 자동으로 오늘로 '이월'되어 보인다. 원래 날에는 '이월됨'으로 남는다.
 */
/* ---------- 카테고리 색 ----------
 * 카테고리마다 팔레트 번호를 하나 붙여 DATA.catColors 에 저장한다.
 * (목록 순서로 정하면 하나를 지울 때 나머지 색이 다 바뀌니까, 한 번 정한 색은 고정)
 */
const CAT_PALETTE = ['#2563eb','#db2777','#16a34a','#ea580c','#7c3aed','#0891b2','#b45309','#dc2626','#4f46e5','#0d9488','#9333ea','#65a30d'];
function ensureCatColors(){
  if(!DATA.catColors) DATA.catColors = {};
  const used = new Set(Object.values(DATA.catColors));
  const names = [...(DATA.categories||[]), ...DATA.tasks.map(t=>t.cat).filter(Boolean)];
  names.forEach(n=>{
    if(DATA.catColors[n] !== undefined) return;
    let i = 0; while(used.has(i) && i < CAT_PALETTE.length) i++;
    if(i >= CAT_PALETTE.length) i = Object.keys(DATA.catColors).length % CAT_PALETTE.length;
    DATA.catColors[n] = i; used.add(i);
  });
}
function catColor(name){
  const i = (DATA.catColors||{})[name];
  return i === undefined ? '#898781' : CAT_PALETTE[i % CAT_PALETTE.length];
}
function catBadgeStyle(name){
  const c = catColor(name);
  return `color:${c};border-color:${c}55;background:${c}14`;
}
function catRank(name){
  const i = (DATA.categories||[]).indexOf(name);
  return i < 0 ? 999 : i;
}
function normalizeTasks(){
  const T = todayStr();
  (DATA.tasks||[]).forEach(t=>{
    if(!t.date) t.date = t.done ? (t.doneAt || T) : T;   // 날짜 기능 이전에 만든 일은 오늘 것으로
    if(t.done && !t.doneAt) t.doneAt = t.date;
    if(typeof t.order !== 'number') t.order = t.id;       // 드래그 순서. 처음엔 만든 순서 그대로
    if(!t.priority) t.priority = 'normal';
  });
  if(!DATA.routineLog) DATA.routineLog = {};
  ensureCatColors();
}
function tasksForDay(D){
  const T = todayStr();
  return DATA.tasks.filter(t=>{
    if(t.done) return t.doneAt===D || (t.date===D && t.doneAt>D);   // 그날 끝낸 일 + 그날 계획했다가 나중에 끝낸 일
    if(D===T) return t.date<=T;                                     // 오늘: 오늘 일 + 지난 미완료(이월)
    return t.date===D;                                              // 다른 날: 그날 계획한 일
  });
}
function taskState(t, D){
  const T = todayStr();
  if(t.done && t.doneAt===D) return 'done';
  if(t.done) return 'moved-done';                 // 이 날 계획 → 다른 날 완료
  if(D===T && t.date<T) return 'carried';         // 지난 날에서 넘어옴
  if(D<T) return 'moved';                         // 이 날 못 해서 오늘로 넘어감
  return 'open';
}
function dayCounts(D){
  const T = todayStr();
  let open=0, carry=0, done=0;
  DATA.tasks.forEach(t=>{
    if(t.done){ if(t.doneAt===D) done++; else if(t.date===D && t.doneAt>D) carry++; return; }
    if(D===T){ if(t.date<=T) open++; }
    else if(t.date===D){ if(D<T) carry++; else open++; }
  });
  return {open, carry, done};
}

/* ---------- 달력 ---------- */
// 주 보기 / 월 보기 (휴대폰은 기본 주 보기 — 화면을 덜 차지하게). 고른 보기는 이 기기에 기억.
let weekMode = (()=>{ try{ const v = localStorage.getItem('pmCalWeekMode'); if(v!==null) return v==='1'; }catch(e){} return window.innerWidth < 640; })();
let weekAnchor = selectedDate;
function toggleCalMode(){
  weekMode = !weekMode;
  try{ localStorage.setItem('pmCalWeekMode', weekMode?'1':'0'); }catch(e){}
  weekAnchor = selectedDate;
  const d = parseYmd(selectedDate); calMonth = new Date(d.getFullYear(), d.getMonth(), 1);
  renderCalendar();
}
function renderCalendar(){
  const T = todayStr();
  let y, m, start, weeks;
  if(weekMode){
    const a = parseYmd(weekAnchor);
    y = a.getFullYear(); m = a.getMonth();
    start = new Date(y, m, a.getDate() - a.getDay());
    weeks = 1;
  }else{
    y = calMonth.getFullYear(); m = calMonth.getMonth();
    const first = new Date(y, m, 1);
    start = new Date(y, m, 1 - first.getDay());
    weeks = Math.ceil((first.getDay() + new Date(y, m+1, 0).getDate()) / 7);
  }
  document.getElementById('calTitle').textContent = `${y}년 ${m+1}월`;
  document.getElementById('calMode').textContent = weekMode ? '월 ▾' : '주 ▴';
  document.querySelector('.cal-legend').style.display = weekMode ? 'none' : '';
  let html = DOW.map((d,i)=>`<div class="cal-dow ${i===0?'sun':i===6?'sat':''}">${d}</div>`).join('');
  for(let i=0;i<weeks*7;i++){
    const d = new Date(start); d.setDate(start.getDate()+i);
    const D = ymd(d);
    const c = dayCounts(D);
    const dots = (c.open?'<i class="open"></i>':'') + (c.carry?'<i class="carry"></i>':'') + (c.done?'<i class="done"></i>':'');
    const cls = ['cal-day', !weekMode && d.getMonth()!==m?'out':'', D===T?'today':'', D===selectedDate?'sel':'', d.getDay()===0?'sun':d.getDay()===6?'sat':''].join(' ');
    const label = `${d.getMonth()+1}월 ${d.getDate()}일 · 남은 일 ${c.open}, 완료 ${c.done}`;
    html += `<button class="${cls}" onclick="selectDate('${D}')" aria-label="${label}"><span class="d-num">${d.getDate()}</span><span class="d-dots">${dots}</span></button>`;
  }
  document.getElementById('calGrid').innerHTML = html;
}
function moveMonth(n){
  if(weekMode){ const a = parseYmd(weekAnchor); a.setDate(a.getDate()+7*n); weekAnchor = ymd(a); }
  else calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth()+n, 1);
  renderCalendar();
}
function selectDate(D){
  selectedDate = D;
  weekAnchor = D;
  const d = parseYmd(D);
  calMonth = new Date(d.getFullYear(), d.getMonth(), 1);
  renderCalendar(); renderTasks(); renderRoutine();
}
function goToday(){ selectDate(todayStr()); }
// 페이지를 켜 둔 채 날짜가 바뀌면(자정) 오늘로 따라간다
let lastToday = todayStr();
function checkDayChange(){
  const T = todayStr();
  if(T===lastToday) return;
  const wasToday = selectedDate===lastToday;
  lastToday = T;
  if(wasToday) selectedDate = T;
  renderHeader(); renderCalendar(); renderTasks(); renderRoutine();
}
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) checkDayChange(); });
setInterval(checkDayChange, 60000);
document.getElementById('clockoutInput').addEventListener('input', updateClockout);
function updateClockout(){
  const val = document.getElementById('clockoutInput').value;
  const now = new Date(); const [h,m]=val.split(':').map(Number);
  const target = new Date(); target.setHours(h,m,0,0);
  const diffMin = Math.round((target-now)/60000);
  const el = document.getElementById('clockoutStatus');
  if(diffMin>0){ el.textContent = `퇴근까지 ${Math.floor(diffMin/60)}시간 ${diffMin%60}분`; el.style.color=''; }
  else { el.textContent = `퇴근 시간 지남 — 정리하고 갈 것`; el.style.color='var(--red)'; }
}

function renderFocus(){
  document.getElementById('focusStrip').innerHTML = DATA.focus.map((f,i)=>`
    <div class="focus-row">
      <span class="fn">0${i+1}</span>
      <input class="ft" type="text" value="${f.title}" onchange="updateFocus(${i},'title',this.value)">
      <input class="fx" type="text" value="${f.target}" onchange="updateFocus(${i},'target',this.value)">
    </div>`).join('');
}
function updateFocus(i, key, val){ DATA.focus[i][key] = val; persist(); }

/* ---------- TASKS ---------- */
/* ---------- 카테고리: 칩으로 고르고, 직접 추가·삭제 ---------- */
let selectedCat = null, selectedOwner = 'me', catEditing = false, catAdding = false;
function renderCatOptions(){
  const cats = DATA.categories || (DATA.categories = []);
  if(!cats.includes(selectedCat)) selectedCat = cats[0] || null;
  const el = document.getElementById('catChips');
  el.classList.toggle('editing', catEditing);
  el.innerHTML = cats.map((c,i)=> catEditing
      ? `<button class="cat-chip" onclick="removeCategory(${i})" title="삭제">${esc(c)} <span class="x">✕</span></button>`
      : `<button class="cat-chip ${c===selectedCat?'on':''}" onclick="pickCat(${i})"><span class="cat-dot" style="background:${catColor(c)}"></span>${esc(c)}</button>`).join('')
    + (catAdding
      ? `<input id="newCatInput" placeholder="새 카테고리" maxlength="20" onkeydown="if(event.key==='Enter')addCategory(); if(event.key==='Escape'){catAdding=false;renderCatOptions();}" onblur="addCategory(true)">`
      : (catEditing ? '' : `<button class="add" onclick="startAddCategory()">+ 추가</button>`))
    + (cats.length ? `<button class="edit" onclick="toggleCatEdit()">${catEditing?'완료':'편집'}</button>` : '');
  if(catAdding){ const inp = document.getElementById('newCatInput'); inp && inp.focus(); }
}
function pickCat(i){ selectedCat = DATA.categories[i]; renderCatOptions(); }
function startAddCategory(){ catAdding = true; catEditing = false; renderCatOptions(); }
function addCategory(fromBlur){
  const inp = document.getElementById('newCatInput');
  if(!inp || !catAdding) return;
  const name = inp.value.trim().slice(0,20);
  catAdding = false;
  if(name && !DATA.categories.includes(name)){ DATA.categories.push(name); ensureCatColors(); persist(); }
  if(name) selectedCat = name;
  renderCatOptions();
}
function toggleCatEdit(){ catEditing = !catEditing; catAdding = false; renderCatOptions(); }
function removeCategory(i){
  const name = DATA.categories[i];
  const used = DATA.tasks.filter(t=>t.cat===name).length;
  if(!confirm(`'${name}' 카테고리를 목록에서 뺄까요?` + (used?`\n(이 카테고리로 만든 할 일 ${used}건은 그대로 남아요)`:''))) return;
  DATA.categories.splice(i,1);
  persist(); renderCatOptions();
}
function setOwner(o){
  selectedOwner = o;
  document.querySelectorAll('#ownerSeg button').forEach(b=>b.classList.toggle('active', b.dataset.owner===o));
}
let selectedPrio = 'normal';
function setPrio(p){
  selectedPrio = p;
  document.querySelectorAll('#prioSeg button').forEach(b=>b.classList.toggle('active', b.dataset.prio===p));
}
function prioBadge(t){
  return t.priority==='urgent'
    ? `<span class="badge urgent" onclick="togglePrio(${t.id})" title="눌러서 일반으로">급건</span>`
    : `<span class="badge normal" onclick="togglePrio(${t.id})" title="눌러서 급건으로">일반</span>`;
}
function toggleProgress(id){
  const t = DATA.tasks.find(t=>t.id===id); if(!t) return;
  if(t.inProgress) delete t.inProgress;
  else { t.inProgress = true; t.progOrder = Math.max(0, ...DATA.tasks.filter(x=>x.inProgress&&x!==t).map(x=>x.progOrder??0)) + 1; }
  persist(); renderTasks();
}
function togglePrio(id){
  const t = DATA.tasks.find(t=>t.id===id); if(!t) return;
  t.priority = t.priority==='urgent' ? 'normal' : 'urgent';
  persist(); renderTasks();
}
function ownerBadge(o){
  if(o==='me') return `<span class="badge owner-me">직접</span>`;
  if(o==='vn') return `<span class="badge owner-vn">VN팀</span>`;
  return `<span class="badge owner-agency">에이전시</span>`;
}
function renderTasks(){
  if(view==='history'){ renderHistory(); return; }
  resetStatLabels();
  const el = document.getElementById('taskList');
  const D = selectedDate, T = todayStr();
  const d = parseYmd(D);
  const diff = daysBetween(T, D);
  document.getElementById('dayTitle').textContent = D===T ? '오늘' : `${d.getMonth()+1}월 ${d.getDate()}일 ${DOW[d.getDay()]}요일`;
  document.getElementById('daySub').textContent = D===T ? `${d.getMonth()+1}월 ${d.getDate()}일 ${DOW[d.getDay()]}요일`
    : diff===1 ? '내일' : diff===-1 ? '어제' : diff>0 ? `${diff}일 뒤` : `${-diff}일 전`;
  document.getElementById('newTaskTitle').placeholder = D===T ? '오늘 할 일 입력하고 Enter' : `${d.getMonth()+1}/${d.getDate()} 할 일 입력하고 Enter`;

  const list = tasksForDay(D).map(t=>({t, st:taskState(t,D)}));
  const order = {carried:0, open:1, moved:2, done:3, 'moved-done':4};
  const isActive = x => x.st==='carried' || x.st==='open';
  list.sort((a,b)=> (isActive(b)-isActive(a)) || (catRank(a.t.cat)-catRank(b.t.cat)) || String(a.t.cat).localeCompare(String(b.t.cat))
                    || (isActive(a) ? 0 : order[a.st]-order[b.st])   // 남은 일은 드래그한 순서 그대로
                    || ((a.t.order??a.t.id)-(b.t.order??b.t.id)) || a.t.id-b.t.id);

  const remain = list.filter(x=>x.st==='open'||x.st==='carried').length;
  const carried = list.filter(x=>x.st==='carried').length;
  const doneN = list.filter(x=>x.st==='done').length;
  const total = remain + doneN;
  document.getElementById('stRemain').textContent = remain;
  document.getElementById('stDone').textContent = doneN;
  document.getElementById('stCarry').textContent = carried;
  document.getElementById('stPct').textContent = total ? Math.round(doneN/total*100)+'%' : '—';

  const row = ({t, st})=>{
    const overdue = t.due && !t.done && isOverdue(t.due);
    const subs = t.subtasks||[];
    const subDone = subs.filter(s=>s.done).length;
    const carryDays = st==='carried' ? daysBetween(t.date, T) : 0;
    let stateBadge = '';
    if(st==='carried') stateBadge = `<span class="badge dplus">D+${carryDays}</span><span class="badge carry">↪ ${fmtDate(t.date)}에서 이월</span>`;
    if(st==='moved') stateBadge = `<span class="badge moved">→ 오늘로 이월됨</span>`;
    if(st==='moved-done') stateBadge = `<span class="badge moved">→ ${fmtDate(t.doneAt)}에 완료</span>`;
    const checked = st==='done' || st==='moved-done';
    const active = st==='open' || st==='carried';
    const gauge = st==='carried' ? `;--carry-pct:${Math.min(carryDays,5)*20}%` : '';
    return `
    <div class="task-row ${checked?'done':''} ${active&&t.inProgress?'inprog':''} ${st==='carried'?'carried':''} ${st==='moved'||st==='moved-done'?'moved':''}" style="--cat:${catColor(t.cat)}${gauge}" data-id="${t.id}">
      <div class="task-main">
        ${active?'<span class="grip" title="끌어서 순서 바꾸기">⋮⋮</span>':''}
        <input type="checkbox" ${checked?'checked':''} onchange="toggleTask(${t.id})" aria-label="완료">
        <div class="t-body">
          <div class="t-title-row">
            <span class="t-title" tabindex="0" title="눌러서 수정" onclick="editTitle(this,${t.id})" onkeydown="if(event.key==='Enter')editTitle(this,${t.id})">${esc(t.title)}</span>
            <button class="t-expand" onclick="toggleSub(${t.id})">${subs.length? `${subDone}/${subs.length} ▸` : '+ 세부 ▸'}</button>
            ${active ? `<button class="t-prog ${t.inProgress?'on':''}" onclick="toggleProgress(${t.id})" title="${t.inProgress?'눌러서 진행중 해제':'눌러서 진행중으로 표시'}">${t.inProgress?'진행중':'▶ 시작'}</button>` : ''}
          </div>
          <div class="t-meta">
            ${stateBadge}
            ${active || t.priority==='urgent' ? prioBadge(t) : ''}
            <span class="badge cat" style="${catBadgeStyle(t.cat)}">${esc(t.cat)}</span>
            ${t.due?`<span class="badge due ${overdue?'overdue':''}">${overdue?'마감 지남 · ':'마감 '}${fmtDate(t.due)}</span>`:''}
            ${t.postpone>0?`<span class="badge postpone">${t.postpone}회 연기</span>`:''}
          </div>
          <div class="sub-panel" id="sub-${t.id}">
            ${subs.map((s,i)=>`
              <div class="sub-row ${s.done?'done':''}">
                <input type="checkbox" ${s.done?'checked':''} onchange="toggleSubtask(${t.id},${i})">
                <span class="st-title" tabindex="0" title="눌러서 수정" onclick="editTitle(this,${t.id},${i})" onkeydown="if(event.key==='Enter')editTitle(this,${t.id},${i})">${esc(s.title)}</span>
                <button class="sub-x" onclick="deleteSubtask(${t.id},${i})">✕</button>
              </div>`).join('')}
            <div class="sub-add">
              <input type="text" id="subinput-${t.id}" placeholder="세부 할 일 추가..." onkeydown="if(event.key==='Enter')addSubtask(${t.id})">
              <button onclick="addSubtask(${t.id})">추가</button>
            </div>
          </div>
        </div>
        <button class="t-x" onclick="deleteTask(${t.id})" aria-label="삭제">✕</button>
      </div>
    </div>`;
  };

  if(!list.length){
    el.innerHTML = `<div class="empty">${D===T?'오늘':'이 날'} 할 일이 없어요. 위에서 추가해보세요.</div>`;
    return;
  }
  const active = list.filter(x=>x.st==='carried'||x.st==='open');
  const rest = list.filter(x=>!(x.st==='carried'||x.st==='open'));
  // 카테고리마다 한 덩어리(cat-block). 카테고리 머리를 끌면 카테고리 순서, ⋮⋮ 를 끌면 할 일 순서가 바뀐다.
  // 진행중인 일은 카테고리와 따로, 맨 위 '진행중' 칸에 모은다 (끌어서 넣고 빼기도 된다)
  const prog = active.filter(x=>x.t.inProgress)
    .sort((a,b)=> ((a.t.progOrder??a.t.id)-(b.t.progOrder??b.t.id)) || a.t.id-b.t.id);
  const rows = active.filter(x=>!x.t.inProgress);
  const progHtml = `<div class="prog-block ${prog.length?'':'empty-prog'}">
      <div class="group-label prog-group"><span class="prog-dot"></span>진행중 <em>${prog.length}</em><span class="prog-hint">${prog.length?'':'▶ 시작을 누르거나 여기로 끌어오세요'}</span></div>
      <div class="cat-tasks prog-tasks" data-prog="1">${prog.map(row).join('')}</div>
    </div>`;
  const cats = [];
  rows.forEach(x=>{ if(!cats.includes(x.t.cat)) cats.push(x.t.cat); });
  const html = cats.map(c=>{
    const items = rows.filter(x=>x.t.cat===c);
    return `<div class="cat-block" data-cat="${esc(c??'')}">
      <div class="group-label cat-group" title="끌어서 카테고리 순서 바꾸기"><span class="grip">⋮⋮</span><span class="cat-dot" style="background:${catColor(c)}"></span>${esc(c||'기타')} <em>${items.length}</em></div>
      <div class="cat-tasks" data-cat="${esc(c??'')}">${items.map(row).join('')}</div>
    </div>`;
  }).join('');
  el.innerHTML = `<div id="taskBoard">${active.length ? progHtml : ''}<div id="activeList">${html}</div></div>`
    + (rest.length ? `<div class="group-label">${D<T?'완료 · 이월':'완료'} <em>${rest.length}</em></div>` + rest.map(row).join('') : '');
  initDrag();
}

/* ---------- 드래그로 순서 바꾸기 ---------- */
let sortables = [];
function initDrag(){
  sortables.forEach(s=>s.destroy()); sortables = [];
  if(typeof Sortable === 'undefined') return;          // 라이브러리를 못 불러오면 드래그만 빠진다
  const list = document.getElementById('activeList'); if(!list) return;
  const common = { animation:150, ghostClass:'drag-ghost', chosenClass:'drag-chosen', delayOnTouchOnly:true, delay:150 };
  // 카테고리 순서
  sortables.push(Sortable.create(list, { ...common, handle:'.cat-group', draggable:'.cat-block', onEnd: saveCatOrder }));
  // 할 일 순서 (다른 카테고리로 옮기면 카테고리도 바뀐다)
  // 진행중 칸과 카테고리 칸 사이를 오가면 진행중 표시가 켜지고 꺼진다
  document.querySelectorAll('#taskBoard .cat-tasks').forEach(box=>{
    sortables.push(Sortable.create(box, { ...common, group:'tasks', handle:'.grip', draggable:'.task-row', onEnd: saveTaskOrder }));
  });
}
function saveCatOrder(){
  const shown = [...document.querySelectorAll('#activeList .cat-block')].map(b=>b.dataset.cat);
  const cats = DATA.categories || [];
  // 화면에 보이는 카테고리끼리만 자리를 바꾸고, 안 보이는 카테고리는 원래 자리에 둔다
  const slots = cats.map((c,i)=> shown.includes(c) ? i : -1).filter(i=>i>=0);
  const reordered = shown.filter(c=>cats.includes(c));
  slots.forEach((slot,k)=>{ cats[slot] = reordered[k]; });
  persist(); renderCatOptions(); renderTasks();
}
function saveTaskOrder(){
  document.querySelectorAll('#taskBoard .cat-tasks').forEach(box=>{
    const isProg = box.dataset.prog === '1';
    const cat = box.dataset.cat;
    [...box.querySelectorAll('.task-row')].forEach((r,i)=>{
      const t = DATA.tasks.find(t=>t.id===Number(r.dataset.id)); if(!t) return;
      if(isProg){ t.inProgress = true; t.progOrder = i; return; }   // 진행중 칸: 카테고리는 그대로
      delete t.inProgress;
      if((t.cat??'') !== cat) t.cat = cat || t.cat;
      t.order = i;
    });
  });
  persist(); renderTasks(); renderCalendar();
}

/* ---------- 완료 기록 탭: 날짜별로 끝낸 일 ---------- */
let view = 'today', histLimit = 14;
function setView(v){
  view = v;
  document.querySelectorAll('#viewSeg button').forEach(b=>b.classList.toggle('active', b.dataset.view===v));
  const hist = v==='history';
  document.getElementById('tabToday').style.display = hist ? 'none' : '';
  document.getElementById('tabHistory').style.display = hist ? '' : 'none';
  document.querySelector('.cal').style.display = hist ? 'none' : '';
  if(hist){ histLimit = 14; renderHistory(); } else renderTasks();
}
function renderHistory(){
  const done = DATA.tasks.filter(t=>t.done && t.doneAt);
  const byDay = {};
  done.forEach(t=>{ (byDay[t.doneAt] ||= []).push(t); });
  const days = Object.keys(byDay).sort().reverse();
  const T = todayStr();
  // 머리판은 완료 기록 요약으로
  const weekAgo = ymd(new Date(Date.now() - 6*86400000));
  document.getElementById('dayTitle').textContent = '완료 기록';
  document.getElementById('daySub').textContent = `일한 날 ${days.length}일`;
  document.getElementById('stRemain').textContent = byDay[T]?.length || 0;
  document.getElementById('stDone').textContent = done.filter(t=>t.doneAt>=weekAgo).length;
  document.getElementById('stCarry').textContent = done.filter(t=>t.doneAt>t.date).length;
  document.getElementById('stPct').textContent = done.length;
  const labels = document.querySelectorAll('.ps-stats dt');
  ['오늘 완료','최근 7일','이월 후 완료','전체 완료'].forEach((s,i)=> labels[i].textContent = s);

  const el = document.getElementById('historyList');
  if(!days.length){ el.innerHTML = `<div class="empty">아직 완료한 일이 없어요.</div>`; return; }
  el.innerHTML = days.slice(0, histLimit).map(D=>{
    const d = parseYmd(D), diff = daysBetween(D, T);
    const when = diff===0 ? '오늘' : diff===1 ? '어제' : `${diff}일 전`;
    const items = byDay[D].sort((a,b)=> catRank(a.cat)-catRank(b.cat) || a.id-b.id);
    return `<div class="hist-day">
      <div class="group-label">${d.getMonth()+1}월 ${d.getDate()}일 ${DOW[d.getDay()]}요일 <em>${when} · ${items.length}건</em></div>
      ${items.map(t=>{
        const late = daysBetween(t.date, D);
        return `<div class="hist-row" style="--cat:${catColor(t.cat)}">
          <input type="checkbox" checked onchange="undoDone(${t.id})" title="체크 풀기(다시 할 일로)" aria-label="완료 취소">
          <span class="h-title">${esc(t.title)}</span>
          <span class="h-meta">
            ${t.priority==='urgent'?'<span class="badge urgent" style="cursor:default">급건</span>':''}
            ${late>0?`<span class="badge carry">D+${late} 완료</span>`:''}
            <span class="badge cat" style="${catBadgeStyle(t.cat)}">${esc(t.cat)}</span>
          </span>
        </div>`;
      }).join('')}
    </div>`;
  }).join('')
  + (days.length > histLimit ? `<button class="hist-more" onclick="histLimit+=14;renderHistory()">이전 기록 더 보기 (${days.length-histLimit}일)</button>` : '');
}
function undoDone(id){
  const t = DATA.tasks.find(t=>t.id===id); if(!t) return;
  if(!confirm(`'${t.title}' 완료를 취소하고 다시 할 일로 돌릴까요?`)){ renderHistory(); return; }
  t.done = false; delete t.doneAt;
  persist(); renderHistory(); renderCalendar();
}
function resetStatLabels(){
  const labels = document.querySelectorAll('.ps-stats dt');
  ['남은 일','완료','이월','진행률'].forEach((s,i)=> labels[i].textContent = s);
}
/* 할 일·세부 할 일 제목을 눌러서 바로 고친다. Enter·바깥 클릭 = 저장, Esc = 취소 */
function editTitle(span, taskId, subIdx){
  const t = DATA.tasks.find(t=>t.id===taskId); if(!t) return;
  const isSub = subIdx !== undefined;
  const cur = isSub ? t.subtasks[subIdx].title : t.title;
  const subOpen = document.getElementById('sub-'+taskId)?.classList.contains('open');
  const inp = document.createElement('input');
  inp.className = 'title-edit'; inp.value = cur; inp.maxLength = 200;
  span.replaceWith(inp); inp.focus(); inp.select();
  let done = false;
  const finish = (save)=>{
    if(done) return; done = true;
    const v = inp.value.trim();
    if(save && v && v !== cur){
      if(isSub) t.subtasks[subIdx].title = v; else t.title = v;
      persist();
    }
    renderTasks();
    if(subOpen || isSub) document.getElementById('sub-'+taskId)?.classList.add('open');
  };
  inp.addEventListener('keydown', e=>{
    if(e.key==='Enter'){ e.preventDefault(); finish(true); }
    else if(e.key==='Escape'){ finish(false); }
  });
  inp.addEventListener('blur', ()=>finish(true));
}
function toggleSub(id){ document.getElementById('sub-'+id).classList.toggle('open'); }
function addSubtask(taskId){
  const input = document.getElementById('subinput-'+taskId);
  const title = input.value.trim(); if(!title) return;
  const t = DATA.tasks.find(t=>t.id===taskId);
  if(!t.subtasks) t.subtasks=[];
  t.subtasks.push({title, done:false});
  persist();
  renderTasks();
  document.getElementById('sub-'+taskId).classList.add('open');
}
function toggleSubtask(taskId,i){
  const t = DATA.tasks.find(t=>t.id===taskId); t.subtasks[i].done ^= true;
  persist();
  renderTasks(); document.getElementById('sub-'+taskId).classList.add('open');
}
function deleteSubtask(taskId,i){
  const t = DATA.tasks.find(t=>t.id===taskId); t.subtasks.splice(i,1);
  persist();
  renderTasks(); document.getElementById('sub-'+taskId).classList.add('open');
}

function renderRoutine(){
  const doneList = (DATA.routineLog||{})[selectedDate] || [];
  document.getElementById('routineMini').innerHTML = DATA.routine.map((r,i)=>{
    const on = doneList.includes(i);
    return `<label class="routine-chip ${on?'checked':''}"><input type="checkbox" ${on?'checked':''} onchange="toggleRoutine(${i})"><span>${esc(r)}</span></label>`;
  }).join('');
}
function toggleRoutine(i){
  if(!DATA.routineLog) DATA.routineLog = {};
  const cur = new Set(DATA.routineLog[selectedDate] || []);
  cur.has(i) ? cur.delete(i) : cur.add(i);
  DATA.routineLog[selectedDate] = [...cur];
  persist(); renderRoutine();
}

function toggleTask(id){
  const t = DATA.tasks.find(t=>t.id===id);
  const T = todayStr();
  t.done = !t.done;
  if(t.done) delete t.inProgress;   // 끝나면 진행중 표시는 내린다
  // 체크한 날 = 보고 있는 날(미래 날짜에서 미리 끝낸 경우는 오늘)
  if(t.done) t.doneAt = selectedDate > T ? T : selectedDate;
  else delete t.doneAt;
  persist(); renderTasks(); renderCalendar();
}
function deleteTask(id){
  const t = DATA.tasks.find(t=>t.id===id);
  if(t && !confirm(`'${t.title}' 을(를) 삭제할까요?`)) return;
  DATA.tasks = DATA.tasks.filter(t=>t.id!==id); persist(); renderTasks(); renderCalendar();
}
function addTask(){
  const title = document.getElementById('newTaskTitle').value.trim(); if(!title) return;
  const cat = selectedCat || '기타';

  const priority = selectedPrio;
  // 급건은 카테고리 맨 위, 일반은 맨 아래에 들어간다(그 뒤엔 드래그로 자유롭게)
  const orders = DATA.tasks.filter(t=>t.cat===cat).map(t=>t.order ?? t.id);
  const order = priority==='urgent' ? Math.min(0, ...orders) - 1 : Math.max(0, ...orders, nextId) + 1;
  DATA.tasks.push({id: nextId++, title, cat, date: selectedDate, priority, order, postpone:0, done:false, subtasks:[]});
  document.getElementById('newTaskTitle').value='';
  setPrio('normal');
  persist();
  renderTasks(); renderCalendar();
}
document.getElementById('newTaskTitle').addEventListener('keydown', e=>{ if(e.key==='Enter') addTask(); });

/* ---------- 전체 렌더 + 초기 부팅 ---------- */
function renderAll(){
  normalizeTasks();
  nextId = Math.max(...DATA.tasks.map(t=>t.id), 0) + 1;
  renderHeader(); updateClockout(); renderFocus(); renderCatOptions();
  renderCalendar(); renderTasks(); renderRoutine();
}

/* ---------- 로그인 / 가입 ---------- */
let authMode = 'login';
function setAuthMode(mode){
  authMode = mode;
  const signup = mode==='signup';
  document.getElementById('authScreen').classList.toggle('signup', signup);
  document.getElementById('authTitle').textContent = signup ? '가입하기' : '로그인';
  document.getElementById('authSubmit').textContent = signup ? '가입하고 시작' : '로그인';
  document.getElementById('authPw').autocomplete = signup ? 'new-password' : 'current-password';
  document.getElementById('authSwitch').innerHTML = signup
    ? '이미 계정이 있나요? <a onclick="setAuthMode(&quot;login&quot;)">로그인</a>'
    : '처음이신가요? <a onclick="setAuthMode(&quot;signup&quot;)">가입하기</a>';
  document.getElementById('authMsg').textContent = '';
}
function showAuth(message){
  clearTimeout(saveTimer);
  booting = true;   // 로그인 화면에선 아무것도 서버로 올리지 않는다
  document.getElementById('appWrap').style.display = 'none';
  document.getElementById('authScreen').style.display = 'block';
  if(message) document.getElementById('authMsg').textContent = message;
}
document.getElementById('authForm').addEventListener('submit', async (ev)=>{
  ev.preventDefault();
  const msg = document.getElementById('authMsg');
  const btn = document.getElementById('authSubmit');
  msg.textContent = ''; btn.disabled = true;
  try{
    const res = await fetch('/api/auth', {
      method:'POST', headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify({
        action: authMode,
        id: document.getElementById('authId').value,
        password: document.getElementById('authPw').value,
        name: document.getElementById('authName').value,
        code: document.getElementById('authCode').value,
      })
    });
    const json = await res.json().catch(()=>({}));
    if(!res.ok){ msg.textContent = json.message || '잠시 후 다시 시도해주세요.'; return; }
    document.getElementById('authPw').value = '';
    await startApp(json.user);
  }catch(e){
    msg.textContent = '서버에 연결하지 못했어요.';
  }finally{ btn.disabled = false; }
});
async function logout(){
  try{ await fetch('/api/auth', { method:'POST', headers:{ 'Content-Type':'application/json' }, body: JSON.stringify({ action:'logout' }) }); }catch(e){}
  location.reload();
}

async function boot(){
  setAuthMode('login');
  let user = null;
  try{
    const res = await fetch('/api/auth', { cache:'no-store' });
    if(res.ok) user = (await res.json()).user;
  }catch(e){}
  if(!user){ showAuth(); return; }
  await startApp(user);
}

async function startApp(user){
  STORAGE_KEY = 'pmTrackerData:' + user.id;
  DATA = structuredClone(DEFAULT_DATA);
  document.getElementById('whoName').textContent = user.name;
  document.title = '오늘 — ' + user.name;
  document.getElementById('authScreen').style.display = 'none';
  document.getElementById('appWrap').style.display = '';
  setSaveStatus('불러오는 중…', 'var(--ink-soft)');
  const { data, source } = await loadData();
  if(source==='auth'){ showAuth('로그인이 풀렸어요. 다시 로그인해주세요.'); return; }

  // 계정 도입 전에 이 기기에만 저장돼 있던 데이터(옛 공용 캐시)가 있고, 내 계정이 아직 비어 있으면
  // 그걸 내 계정으로 올린다. 서버 저장이 성공한 뒤에만 옛 캐시를 지운다.
  let legacyLocal = null;
  try{
    const p = JSON.parse(localStorage.getItem('pmTrackerData') || 'null');
    if(p && Array.isArray(p.tasks)) legacyLocal = p;
  }catch(e){}
  if(source==='server-empty' && legacyLocal){
    DATA = legacyLocal;
    renderAll();
    booting = false;
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(DATA)); }catch(e){}
    setSaveStatus('이 기기의 기존 데이터를 계정으로 옮기는 중…', 'var(--ink-soft)');
    if(await saveToServer()){
      try{ localStorage.removeItem('pmTrackerData'); }catch(e){}
      setSaveStatus('기존 데이터를 계정으로 옮겼어요', 'var(--sage)');
    }
    return;
  }

  DATA = data || structuredClone(DEFAULT_DATA);
  renderAll();
  booting = false;
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(DATA)); }catch(e){}

  if(source==='server' || source==='cache'){
    setSaveStatus('클라우드에 자동 저장', 'var(--sage)');
  }else if(source==='server-empty'){
    // 서버는 살아있지만 아직 비어있음 → 지금 화면(기본값)을 서버에 한 번 심어둔다
    setSaveStatus('처음 저장 중…', 'var(--ink-soft)');
    saveToServer();
  }else{
    // 서버 연결 실패 + 캐시도 없음 → 기본값 표시. 서버로 덮어쓰지 않는다.
    setSaveStatus('서버에 연결 못함 — 이 기기에만 저장돼요', 'var(--gold)');
  }

  // 계정에 이미 데이터가 있는데 이 기기에 계정 도입 전 데이터도 남아 있으면 → 복원 버튼을 보여준다
  if(legacyLocal && source==='server') showRestoreBar(legacyLocal);
}

function showRestoreBar(legacy){
  if(document.getElementById('restoreBar')) return;
  const bar = document.createElement('div');
  bar.id = 'restoreBar';
  bar.style.cssText = 'background:var(--yellow-wash);border:1px solid var(--ink);border-left-width:6px;border-radius:8px;padding:10px 12px;margin-bottom:14px;font-size:12.5px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;';
  bar.innerHTML = '<span style="flex:1;min-width:200px">이 기기에 <b>로그인 도입 전 데이터</b>가 남아 있어요. 지금 화면 대신 그 데이터로 바꿀 수 있어요.</span>'
    + '<button class="save-btn" id="restoreYes">이 기기 데이터로 복원</button>'
    + '<button class="save-btn" id="restoreNo" style="background:var(--ink-soft)">닫기</button>';
  document.querySelector('.ps-head').after(bar);
  document.getElementById('restoreNo').onclick = ()=> bar.remove();
  document.getElementById('restoreYes').onclick = async ()=>{
    if(!confirm('지금 계정에 있는 내용을 이 기기의 이전 데이터로 바꿉니다. 진행할까요?\n(지금 내용은 이 기기에 백업해 둡니다)')) return;
    try{ localStorage.setItem(STORAGE_KEY + ':backup', JSON.stringify(DATA)); }catch(e){}
    DATA = legacy;
    renderAll();
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(DATA)); }catch(e){}
    if(await saveToServer()){
      try{ localStorage.removeItem('pmTrackerData'); }catch(e){}
      setSaveStatus('이 기기의 이전 데이터로 복원했어요', 'var(--sage)');
      bar.remove();
    }
  };
}
boot();

</script>
</body>
</html>
